<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#087f8c">

  <!-- iPhone / iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="門市庫存管理"
  >

  <!-- App 基本資料 -->
  <title>門市庫存管理</title>

  <!-- PWA Manifest -->
  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <!-- iPhone 主畫面圖示 -->
  <link
    rel="apple-touch-icon"
    href="icon-180.png"
  >

  <!-- 樣式 -->
  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <div id="app">

    <header>
      <h1>門市庫存管理</h1>
      <small>Inventory V7.6</small>
    </header>

    <main id="content">
      <h2>系統啟動中...</h2>
    </main>

    <nav>
      <button
        type="button"
        onclick="showPage('home')"
      >
        首頁
      </button>

      <button
        type="button"
        onclick="showPage('inventory')"
      >
        庫存
      </button>

      <button
        type="button"
        onclick="showPage('movement')"
      >
        異動
      </button>

      <button
        type="button"
        onclick="showPage('order')"
      >
        叫貨
      </button>

      <button
        type="button"
        onclick="showPage('manage')"
      >
        管理
      </button>
    </nav>

  </div>

  <!-- 主程式 -->
  <script src="app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function (error) {
            console.log(
              "Service Worker 尚未啟用：",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
